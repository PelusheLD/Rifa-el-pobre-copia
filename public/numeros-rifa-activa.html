<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selecciona tus números</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto p-6 flex-grow">
      <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
        Selecciona tus números para la rifa activa
      </h1>

      <!-- Layout de columnas -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Columna izquierda: grilla -->
        <div class="lg:col-span-2 max-h-[80vh] overflow-y-auto pr-4">
          <div id="grid" class="grid grid-cols-10 gap-3"></div>
        </div>

        <!-- Columna derecha: selección -->
        <div class="sticky top-6 bg-white shadow-md rounded-lg p-6 h-fit">
          <h2 class="text-2xl font-semibold text-gray-700 mb-4">
            Números seleccionados
          </h2>
          <ul id="seleccionados" class="flex flex-wrap gap-2 mb-6"></ul>
          <div class="text-sm text-gray-500 mb-4" id="contadorSeleccion">
            Total: 0 seleccionados
          </div>

          <button
            id="adquirir"
            class="w-full bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white font-semibold py-3 px-6 rounded-full text-lg shadow-md transition duration-300"
          >
            Apartar seleccionados
          </button>
          <button
            id="verificar"
            class="w-full mt-4 bg-gradient-to-r from-gray-600 to-gray-800 hover:from-gray-700 hover:to-gray-900 text-white font-semibold py-3 px-6 rounded-full text-lg shadow-md transition duration-300"
          >
            Verificar Número
          </button>

          <!-- 🔥 Aquí agregamos el card de información de la rifa -->
          <div id="info-rifa" class="mt-8"></div>
        </div>
      </div>
    </div>

    <!-- Modal para datos del usuario -->
    <div
      id="modalUsuario"
      class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50"
    >
      <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Tus datos</h2>
        <form id="formUsuario" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-600"
              >Cedula</label
            >
            <input
              type="text"
              name="cedula"
              required
              class="w-full mt-1 px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600"
              >Nombre</label
            >
            <input
              type="text"
              name="nombre"
              required
              class="w-full mt-1 px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600"
              >Apellido</label
            >
            <input
              type="text"
              name="apellido"
              required
              class="w-full mt-1 px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600"
              >Teléfono</label
            >
            <input
              type="tel"
              name="telefono"
              required
              class="w-full mt-1 px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-600"
              >Correo electrónico (opcional)</label
            >
            <input
              type="email"
              name="correo"
              class="w-full mt-1 px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div class="flex justify-end gap-4 pt-4">
            <button
              type="button"
              id="cancelarModal"
              class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
            >
              Confirmar
            </button>
          </div>
        </form>
      </div>
    </div>
    <div
      id="modalVerificar"
      class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50"
    >
      <div
        class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md text-center"
      >
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">
          Consulta tus Números
        </h2>
        <input
          id="cedulaVerificar"
          type="text"
          placeholder="Ingresa tu cédula"
          class="w-full mb-4 px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div
          id="resultadoVerificacion"
          class="text-sm text-left text-gray-700 mb-4"
        ></div>
        <div class="flex justify-end gap-4 pt-2">
          <button
            class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800"
            onclick="cerrarModalVerificacion()"
          >
            Cerrar
          </button>

          <button
            class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
            onclick="buscarPorCedula()"
          >
            Verificar
          </button>
        </div>
      </div>
    </div>

    <footer
      id="footer"
      class="bg-gray-200 py-4 text-center text-sm text-gray-600"
    >
      © 2025 Rifas Empire. Todos los derechos reservados.
    </footer>
    <div
      id="confirmContainer"
      class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50"
    ></div>

    <!-- tus scripts -->
    <script src="js/toast.js"></script>
    <script src="js/seleccion-numeros.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>

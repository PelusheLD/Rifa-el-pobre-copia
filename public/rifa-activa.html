<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rifa Activa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fade-in {
        animation: fade-in 0.5s ease-out;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar dinámico -->
    <header id="navbar"></header>

    <!-- Contenido principal (flex-grow para empujar el footer abajo) -->
    <main class="flex-grow">
      <!-- Hero dinámico -->
      <section
        class="max-w-4xl mx-auto bg-white shadow-md rounded-lg bg-gray-50 my-10"
      >
        <h1 class="text-4xl font-extrabold text-center text-gray-800 pt-6">
          ¡Rifa Activa!
        </h1>
        <div id="rifa-activa-contenido" class="p-6 text-center text-gray-600">
          Cargando rifa activa...
        </div>
      </section>
    </main>

    <!-- Footer dinámico, siempre al fondo -->
    <footer
      id="footer"
      class="bg-gray-200 py-4 text-center text-sm text-gray-600"
    >
      © 2025 Rifas Empire. Todos los derechos reservados.
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
